<!DOCTYPE html>
<html>
<head>
    <title>Icon Generator</title>
</head>
<body>
    <canvas id="canvas" width="512" height="512"></canvas>
    <br>
    <button onclick="download()">Download PNG</button>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Background
        ctx.fillStyle = '#000000';
        ctx.roundRect(0, 0, 512, 512, 80);
        ctx.fill();

        // Film strip frame
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 8;
        ctx.roundRect(80, 120, 352, 272, 20);
        ctx.stroke();

        // Film perforations - left
        ctx.fillStyle = '#ffffff';
        ctx.roundRect(90, 140, 20, 30, 5);
        ctx.fill();
        ctx.roundRect(90, 200, 20, 30, 5);
        ctx.fill();
        ctx.roundRect(90, 260, 20, 30, 5);
        ctx.fill();
        ctx.roundRect(90, 320, 20, 30, 5);
        ctx.fill();

        // Film perforations - right
        ctx.roundRect(402, 140, 20, 30, 5);
        ctx.fill();
        ctx.roundRect(402, 200, 20, 30, 5);
        ctx.fill();
        ctx.roundRect(402, 260, 20, 30, 5);
        ctx.fill();
        ctx.roundRect(402, 320, 20, 30, 5);
        ctx.fill();

        // GIF text
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 120px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.letterSpacing = '-5px';
        ctx.fillText('GIF', 256, 256);

        // Sparkle effect
        ctx.globalAlpha = 0.8;
        ctx.beginPath();
        ctx.arc(370, 160, 8, 0, Math.PI * 2);
        ctx.fill();

        ctx.globalAlpha = 0.6;
        ctx.beginPath();
        ctx.arc(390, 180, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.globalAlpha = 0.7;
        ctx.beginPath();
        ctx.arc(350, 190, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.globalAlpha = 1.0;

        // Bottom text
        ctx.font = '32px Arial';
        ctx.letterSpacing = '8px';
        ctx.fillText('MAKER', 256, 420);

        function download() {
            canvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'icon.png';
                a.click();
            });
        }
    </script>
</body>
</html>
